<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

  <title>AMFEMS VERITAS</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    #map {
      height: 380px;
      width: 100%;

    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header Header Header -->
  <header class="bg-slate-800 border-b border-slate-700 shadow-lg sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-red-600 p-2.5 rounded-xl shadow-md flex items-center justify-center">
          <i class="fa-solid fa-truck-medical text-white text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide text-white">AMFEMS VERITAS</h1>
          <p class="text-xs text-slate-400">Anchorage Middletown Fire & EMS Jurisdiction Identifier</p>
        </div>
      </div>
      <span class="bg-slate-700 text-slate-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-slate-600">
        v2.0
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

    <!-- Address Input Section -->
    <section class="bg-slate-800 rounded-xl p-5 border border-slate-700 shadow-md">
      <label for="addressInput" class="block text-sm font-medium text-slate-300 mb-2">
        Enter Incident Address or Location
      </label>
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="relative flex-grow">
          <input 
            type="text" 
            id="addressInput" 
            placeholder="e.g. 108 Urton Ln, Louisville, KY" 
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 pl-10 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
          >
          <i class="fa-solid fa-location-dot absolute left-3.5 top-3.5 text-slate-500"></i>
        </div>
        <button 
          id="searchBtn" 
          onclick="verifyAddress()" 
          class="bg-red-600 hover:bg-red-700 text-white font-semibold px-6 py-3 rounded-lg shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2"
        >
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Verify Location</span>
        </button>
      </div>
    </section>

    <!-- Verification Results Panel -->
    <section id="resultCard" class="hidden bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-md transition-all duration-300">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-4 border-b border-slate-700">
        <div class="flex items-center space-x-4">
          <div id="statusBadgeIcon" class="p-3 rounded-xl flex items-center justify-center text-2xl">
            <!-- Dynamic Icon -->
          </div>
          <div>
            <div id="statusBadge" class="text-sm font-bold uppercase tracking-wider mb-0.5">
              <!-- Dynamic Status Text -->
            </div>
            <h2 id="resolvedAddress" class="text-lg font-semibold text-white">
              <!-- Dynamic Address -->
            </h2>
            <p id="coordsText" class="text-xs text-slate-400 font-mono mt-0.5">
              <!-- Coordinates -->
            </p>
          </div>
        </div>

        <!-- Navigation Action Button -->
        <a 
          id="navigateBtn" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg shadow transition text-sm cursor-pointer"
        >
          <i class="fa-solid fa-diamond-turn-right"></i>
          <span>Navigate with Google Maps</span>
        </a>
      </div>

      <!-- Additional Details Details -->
      <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
        <div class="bg-slate-900/60 p-3.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 text-xs block uppercase font-medium">Jurisdiction Status</span>
          <span id="jurisdictionDetail" class="text-slate-200 font-medium text-base">---</span>
        </div>
        <div class="bg-slate-900/60 p-3.5 rounded-lg border border-slate-700/50">
          <span class="text-slate-400 text-xs block uppercase font-medium">Primary Agency Response</span>
          <span id="agencyDetail" class="text-slate-200 font-medium text-base">---</span>
        </div>
      </div>
    </section>

    <!-- Map Container -->
    <section class="bg-slate-800 rounded-xl p-2 border border-slate-700 shadow-md overflow-hidden">
      <div id="map"></div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-800 border-t border-slate-700 py-4 text-center text-xs text-slate-500">
    AMFEMS VERITAS • Anchorage Middletown Fire & Emergency Medical Services
  </footer>

    let map;
    let geoJsonLayer;
    let marker;

    // Initialize Map on page load
    window.addEventListener('DOMContentLoaded', () => {
      initMap();

      // Enter key search support
      document.getElementById('addressInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          verifyAddress();
        }
      });
    });

    function initMap() {
      // Default view centered on Anchorage Middletown area
      map = L.map('map').setView([38.25, -85.52], 11);

      // OpenStreetMap Base Tile Layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Render AMFEMS GeoJSON Boundary Overlay
      geoJsonLayer = L.geoJSON(amfemsGeoJson, {
        style: {
          color: '#ef4444',       // Red-500 border
          weight: 2.5,
          opacity: 0.85,
          fillColor: '#f87171',   // Red-400 fill
          fillOpacity: 0.18
        }
      }).addTo(map);

      // Fit map bounds to polygon
      map.fitBounds(geoJsonLayer.getBounds());
    }

    async function verifyAddress() {
      const address = document.getElementById('addressInput').value.trim();
      if (!address) return;

      const searchBtn = document.getElementById('searchBtn');
      searchBtn.disabled = true;
      searchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Verifying...</span>`;

      try {
        // Geocode address using Nominatim API
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          showError("Address not found. Please try entering a more specific address.");
          return;
        }

        const topResult = data[0];
        const lat = parseFloat(topResult.lat);
        const lon = parseFloat(topResult.lon);
        const displayName = topResult.display_name;

        // Perform Turf Point-in-Polygon validation
        const point = turf.point([lon, lat]);
        const polygonFeature = amfemsGeoJson.features[0];
        const isInJurisdiction = turf.booleanPointInPolygon(point, polygonFeature);

        updateUI(isInJurisdiction, displayName, lat, lon);

      } catch (err) {
        console.error("Geocoding error:", err);
        showError("Unable to verify address at this time. Check connection and try again.");
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><span>Verify Location</span>`;
      }
    }

    function updateUI(inJurisdiction, address, lat, lon) {
      const resultCard = document.getElementById('resultCard');
      const statusBadgeIcon = document.getElementById('statusBadgeIcon');
      const statusBadge = document.getElementById('statusBadge');
      const resolvedAddress = document.getElementById('resolvedAddress');
      const coordsText = document.getElementById('coordsText');
      const navigateBtn = document.getElementById('navigateBtn');
      const jurisdictionDetail = document.getElementById('jurisdictionDetail');
      const agencyDetail = document.getElementById('agencyDetail');

      resultCard.classList.remove('hidden');

      resolvedAddress.textContent = address;
      coordsText.textContent = `LAT: ${lat.toFixed(5)} | LON: ${lon.toFixed(5)}`;

      // Update Navigation Link for Google Maps
      navigateBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

      if (inJurisdiction) {
        // IN JURISDICTION - Green/Success styling
        resultCard.className = "bg-slate-800 rounded-xl p-6 border border-emerald-500/40 shadow-md transition-all duration-300";
        statusBadgeIcon.className = "p-3 rounded-xl flex items-center justify-center text-2xl bg-emerald-500/20 text-emerald-400";
        statusBadgeIcon.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
        statusBadge.className = "text-sm font-bold uppercase tracking-wider mb-0.5 text-emerald-400";
        statusBadge.textContent = "In AMFEMS Jurisdiction";
        jurisdictionDetail.textContent = "Anchorage Middletown Fire & EMS District";
        jurisdictionDetail.className = "text-emerald-400 font-semibold text-base";
        agencyDetail.textContent = "AMFEMS Primary Dispatch (First Due)";
      } else {
        // OUT OF JURISDICTION - Amber/Warning styling
        resultCard.className = "bg-slate-800 rounded-xl p-6 border border-amber-500/40 shadow-md transition-all duration-300";
        statusBadgeIcon.className = "p-3 rounded-xl flex items-center justify-center text-2xl bg-amber-500/20 text-amber-400";
        statusBadgeIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i>`;
        statusBadge.className = "text-sm font-bold uppercase tracking-wider mb-0.5 text-amber-400";
        statusBadge.textContent = "Out of Jurisdiction";
        jurisdictionDetail.textContent = "Outside AMFEMS Boundary";
        jurisdictionDetail.className = "text-amber-400 font-semibold text-base";
        agencyDetail.textContent = "Mutual Aid / Neighboring Agency Jurisdiction";
      }

      // Map View Update
      map.setView([lat, lon], 14);

      if (marker) {
        map.removeLayer(marker);
      }

      marker = L.marker([lat, lon]).addTo(map)
        .bindPopup(`<b>${inJurisdiction ? 'Inside AMFEMS' : 'Outside AMFEMS'}</b><br>${address}`)
        .openPopup();
    }

    function showError(msg) {
      alert(msg);
    }
  </script>
