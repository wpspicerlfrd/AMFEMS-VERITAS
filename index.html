<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMFEMS-VERITAS // EMS Address Verifier</title>
    
    <style>
        :root {
            --amfems-red: #c8102e;
            --amfems-dark: #121820;
            --amfems-gray: #f4f6f8;
            --amfems-border: #e1e5eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--amfems-gray);
            color: #2c3e50;
        }

        header {
            background-color: var(--amfems-dark);
            color: #ffffff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--amfems-red);
        }

        header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.8px;
        }

        header .badge {
            background-color: var(--amfems-red);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 400px;
            background: #ffffff;
            padding: 24px;
            border-right: 1px solid var(--amfems-border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 2;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                max-height: 50vh;
                border-right: none;
                border-top: 1px solid var(--amfems-border);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 700;
            font-size: 0.85rem;
            color: #4a5568;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--amfems-red);
            box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.15);
        }

        /* Verification Result Card */
        #result-card {
            padding: 18px;
            border-radius: 8px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 6px solid #cbd5e0;
            display: none;
        }

        #result-card.in-district {
            background: #f0fdf4;
            border-color: #bbf7d0;
            border-left-color: #16a34a;
            color: #14532d;
        }

        #result-card.out-district {
            background: #fef2f2;
            border-color: #fecaca;
            border-left-color: #dc2626;
            color: #7f1d1d;
        }

        .status-header {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-details {
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .coords {
            font-family: monospace;
            font-size: 0.8rem;
            margin-top: 8px;
            opacity: 0.8;
        }

        /* Map Element */
        #map {
            flex: 1;
            height: 100%;
            width: 100%;
        }

        .footer-note {
            font-size: 0.8rem;
            color: #718096;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid var(--amfems-border);
        }
    </style>

    <!-- Google Maps API with Places Library -->
    <!-- REPLACE YOUR_GOOGLE_MAPS_API_KEY WITH YOUR ACTUAL API KEY -->
    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places&callback=initMap" async defer></script>
</head>
<body>

    <header>
        <div class="brand">
            <h1>AMFEMS-VERITAS</h1>
            <span class="badge">EMS Boundary Check</span>
        </div>
        <span style="font-size: 0.85rem; opacity: 0.85;">Anchorage Middletown Fire & EMS</span>
    </header>

    <div class="main-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="form-group">
                <label for="address-input">Incident Address Lookup</label>
                <input type="text" id="address-input" placeholder="Type location or address...">
            </div>

            <div id="result-card">
                <div class="status-header" id="status-header">Checking...</div>
                <div class="status-details" id="status-details"></div>
                <div class="coords" id="status-coords"></div>
            </div>

            <div class="footer-note">
                <strong>Instructions:</strong> Search an address using the Google Places lookup above or click anywhere directly on the map to evaluate coordinates against the primary EMS response polygon.
            </div>
        </div>

        <!-- Google Map Container -->
        <div id="map"></div>
    </div>

    <script>
        let map;
        let emsPolygon;
        let activeMarker;

        // 1. Defined EMS Response Area Polygon
        // Paste/replace coordinates array below with your exact GeoJSON boundary coordinates [lat, lng]
        const emsResponseBoundary = [
            { lat: 38.2750, lng: -85.5800 },
            { lat: 38.2750, lng: -85.4800 },
            { lat: 38.2100, lng: -85.4800 },
            { lat: 38.2100, lng: -85.5800 }
        ];

        function initMap() {
            // Center near Anchorage Middletown response coverage area
            const defaultCenter = { lat: 38.2430, lng: -85.5300 };

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: defaultCenter,
                mapTypeId: google.maps.MapTypeId.ROADMAP,
                fullscreenControl: false,
                streetViewControl: false
            });

            // 2. Draw the EMS Response Area Polygon
            emsPolygon = new google.maps.Polygon({
                paths: emsResponseBoundary,
                strokeColor: "#c8102e",
                strokeOpacity: 0.85,
                strokeWeight: 2,
                fillColor: "#c8102e",
                fillOpacity: 0.15,
                map: map
            });

            // 3. Set up Google Places Autocomplete on input
            const input = document.getElementById("address-input");
            const autocomplete = new google.maps.places.Autocomplete(input, {
                componentRestrictions: { country: "us" },
                fields: ["formatted_address", "geometry", "name"]
            });

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) {
                    alert("No details available for input: '" + place.name + "'");
                    return;
                }

                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();
                const addressName = place.formatted_address || place.name;

                evaluateLocation(lat, lng, addressName);
            });

            // 4. Map click event listener for manual coordinate pin drop
            map.addListener("click", (e) => {
                const lat = e.latLng.lat();
                const lng = e.latLng.lng();
                evaluateLocation(lat, lng, "Dropped Map Pin");
            });
        }

        // 5. Check if Lat/Lng is inside EMS Response Area Polygon
        function evaluateLocation(lat, lng, label) {
            const latLngPoint = new google.maps.LatLng(lat, lng);
            
            // Native Google Maps API point-in-polygon check
            const isInEmsArea = google.maps.geometry.poly.containsLocation(latLngPoint, emsPolygon);

            // Update Marker
            if (activeMarker) {
                activeMarker.setMap(null);
            }

            activeMarker = new google.maps.Marker({
                position: latLngPoint,
                map: map,
                title: label,
                animation: google.maps.Animation.DROP
            });

            map.panTo(latLngPoint);
            if (map.getZoom() < 14) map.setZoom(14);

            // Update Result UI
            const card = document.getElementById("result-card");
            const header = document.getElementById("status-header");
            const details = document.getElementById("status-details");
            const coords = document.getElementById("status-coords");

            card.style.display = "block";

            if (isInEmsArea) {
                card.className = "in-district";
                header.innerHTML = "🟢 IN EMS RESPONSE AREA";
                details.innerHTML = `Address <strong>${label}</strong> is inside the primary AMFEMS response district boundaries.`;
            } else {
                card.className = "out-district";
                header.innerHTML = "🔴 OUT OF EMS AREA";
                details.innerHTML = `Address <strong>${label}</strong> is outside the primary AMFEMS response district boundaries. Direct for Mutual Aid or secondary routing.`;
            }

            coords.innerText = `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}`;
        }
    </script>
</body>
</html>
