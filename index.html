    let map;
    let marker;

    function initMap() {
      // Calculate initial map center from coordinate dataset average
      const defaultCenter = { lat: 38.312, lng: -85.632 };

      // Initialize Map
      map = new google.maps.Map(document.getElementById("map"), {
        center: defaultCenter,
        zoom: 12,
        mapTypeId: google.maps.MapTypeId.ROADMAP
      });

      // Convert GeoJSON-style [lng, lat] coordinates to Google Maps LatLng format
      const pathCoordinates = coordinateData.map(coord => ({
        lat: coord[1],
        lng: coord[0]
      }));

      // Draw Polyline for dataset points
      const datasetPolyline = new google.maps.Polyline({
        path: pathCoordinates,
        geodesic: true,
        strokeColor: "#FF0000",
        strokeOpacity: 0.8,
        strokeWeight: 4
      });

      datasetPolyline.setMap(map);

      // Initialize Places Autocomplete
      const input = document.getElementById("address-input");
      const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["address"],
        componentRestrictions: { country: "us" }
      });

      // Bind autocomplete bounds to the current map view
      autocomplete.bindTo("bounds", map);

      // Create a marker for search selections
      marker = new google.maps.Marker({
        map: map,
        anchorPoint: new google.maps.Point(0, -29)
      });

      // Listener for place selection from autocomplete dropdown
      autocomplete.addListener("place_changed", () => {
        marker.setVisible(false);
        const place = autocomplete.getPlace();

        if (!place.geometry || !place.geometry.location) {
          window.alert("No details available for input: '" + place.name + "'");
          return;
        }

        // Center and zoom map to selected location
        if (place.geometry.viewport) {
          map.fitBounds(place.geometry.viewport);
        } else {
          map.setCenter(place.geometry.location);
          map.setZoom(17);
        }

        // Position and display marker
        marker.setPosition(place.geometry.location);
        marker.setVisible(true);
      });
    }
