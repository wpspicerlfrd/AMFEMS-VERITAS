<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STMFD SMART EMS - Address Verifier</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        :root {
            --primary-color: #b30000; /* Fire/EMS Red */
            --secondary-color: #1a1a1a;
            --bg-color: #f4f4f9;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-color);
        }

        header {
            background-color: var(--secondary-color);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--primary-color);
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.5px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
            }
        }

        /* Sidebar Control Panel */
        .sidebar {
            width: 380px;
            background: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                max-height: 45vh;
                box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #800000;
        }

        /* Result Card */
        #result-card {
            padding: 15px;
            border-radius: 6px;
            background: #f9f9f9;
            border-left: 5px solid #ccc;
            font-size: 0.9rem;
            display: none;
        }

        #result-card.in-district {
            background: #e6f4ea;
            border-left-color: #137333;
            color: #0d652d;
        }

        #result-card.out-district {
            background: #fce8e6;
            border-left-color: #c5221f;
            color: #a50e0e;
        }

        .status-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        /* Map Container */
        #map {
            flex: 1;
            height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>STMFD SMART EMS // Address Verifier</h1>
        <span style="font-size: 0.85rem; opacity: 0.8;">District Boundary & Routing Tool</span>
    </header>

    <div class="main-container">
        <!-- Sidebar Controls -->
        <div class="sidebar">
            <div class="form-group">
                <label for="address-input">Enter Incident Address:</label>
                <div class="search-box">
                    <input type="text" id="address-input" placeholder="e.g., 240 Sears Ave, Louisville, KY">
                    <button id="search-btn">Verify</button>
                </div>
            </div>

            <div id="result-card">
                <div class="status-title" id="status-title">Checking...</div>
                <div id="status-details"></div>
            </div>

            <div style="font-size: 0.8rem; color: #666; margin-top: auto; border-top: 1px solid #eee; padding-top: 10px;">
                Tip: You can also click anywhere directly on the map to query boundary status for coordinates.
            </div>
        </div>

        <!-- Interactive Map -->
        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Turf.js for spatial point-in-polygon analysis -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

    <script>
        // 1. Initialize Map centered around St. Matthews / Louisville area
        const map = L.map('map').setView([38.2527, -85.6320], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. Define STMFD District Boundary GeoJSON (Replace or expand this Polygon with actual district polygon coordinates)
        let districtFeature = {
            "type": "Feature",
            "properties": { "name": "St. Matthews Fire Protection District" },
            "geometry": {
                "type": "Polygon",
                "coordinates": [[
                    [-85.6550, 38.2650],
                    [-85.6100, 38.2650],
                    [-85.6100, 38.2350],
                    [-85.6550, 38.2350],
                    [-85.6550, 38.2650]
                ]]
            }
        };

        // Style and add district boundary layer to map
        const districtLayer = L.geoJSON(districtFeature, {
            style: {
                color: '#b30000',
                weight: 3,
                fillColor: '#b30000',
                fillOpacity: 0.15
            }
        }).addTo(map);

        let activeMarker = null;

        // 3. Evaluation Function (Point-in-Polygon check via Turf.js)
        function checkLocation(lat, lng, label = "Selected Location") {
            const point = turf.point([lng, lat]);
            const polygon = turf.polygon(districtFeature.geometry.coordinates);
            const isInDistrict = turf.booleanPointInPolygon(point, polygon);

            // Update or create marker on map
            if (activeMarker) {
                map.removeLayer(activeMarker);
            }
            activeMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>${label}</b><br>${isInDistrict ? '🟢 In District' : '🔴 Out of District'}`)
                .openPopup();

            map.setView([lat, lng], 15);

            // Update UI card
            const card = document.getElementById('result-card');
            const title = document.getElementById('status-title');
            const details = document.getElementById('status-details');

            card.style.display = 'block';
            if (isInDistrict) {
                card.className = 'in-district';
                title.innerText = 'IN DISTRICT';
                details.innerHTML = `Address verified inside <b>St. Matthews Fire Protection District</b>.<br><small>Lat/Lng: ${lat.toFixed(4)}, ${lng.toFixed(4)}</small>`;
            } else {
                card.className = 'out-district';
                title.innerText = 'OUT OF DISTRICT / MUTUAL AID';
                details.innerHTML = `Location falls outside primary response boundaries.<br><small>Lat/Lng: ${lat.toFixed(4)}, ${lng.toFixed(4)}</small>`;
            }
        }

        // 4. Geocoding Search handler (Nominatim API)
        async function searchAddress() {
            const query = document.getElementById('address-input').value;
            if (!query) return;

            const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);
                    checkLocation(lat, lng, data[0].display_name);
                } else {
                    alert('Address not found. Please check spelling or click directly on the map.');
                }
            } catch (error) {
                console.error('Geocoding error:', error);
                alert('Error connecting to geocoding service.');
            }
        }

        // Event listeners
        document.getElementById('search-btn').addEventListener('click', searchAddress);
        document.getElementById('address-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchAddress();
        });

        // Click on map to test coordinates
        map.on('click', function(e) {
            checkLocation(e.latlng.lat, e.latlng.lng, "Dropped Pin");
        });
    </script>
</body>
</html>
