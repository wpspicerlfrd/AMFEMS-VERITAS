        function initMap() {
            // Initialize the Google Map
            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 16,
                center: geofenceCoords[0], // Centers on the first coordinate point
                mapId: "DEMO_MAP_ID" // Required for AdvancedMarkerElement
            });

            // Draw the Geofence Polygon
            const geofence = new google.maps.Polygon({
                paths: geofenceCoords,
                strokeColor: "#FF0000",
                strokeOpacity: 0.8,
                strokeWeight: 2,
                fillColor: "#FF0000",
                fillOpacity: 0.35,
            });
            geofence.setMap(map);

            // Setup Places Autocomplete
            const input = document.getElementById("autocomplete");
            autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            // Listen for location selections
            autocomplete.addListener("place_changed", onPlaceChanged);
        }

        function onPlaceChanged() {
            const place = autocomplete.getPlace();

            if (!place.geometry || !place.geometry.location) {
                alert("No details available for input: '" + place.name + "'");
                return;
            }

            // Adjust map view
            if (place.geometry.viewport) {
                map.fitBounds(place.geometry.viewport);
            } else {
                map.setCenter(place.geometry.location);
                map.setZoom(17);
            }

            // Remove existing marker if present
            if (marker) {
                marker.map = null;
            }

            // Modern AdvancedMarkerElement
            marker = new google.maps.marker.AdvancedMarkerElement({
                position: place.geometry.location,
                map: map,
                title: place.name
            });

            // Update share link input
            const lat = place.geometry.location.lat();
            const lng = place.geometry.location.lng();
            document.getElementById("shareUrl").value = `${window.location.origin}${window.location.pathname}?lat=${lat}&lng=${lng}`;
        }

        // Modern asynchronous clipboard handling with fallback
        function copyShareUrl() {
            const shareUrlInput = document.getElementById("shareUrl");
            
            if (!shareUrlInput.value) {
                alert("No URL to copy yet. Search for a location first!");
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrlInput.value)
                    .then(() => alert("Link copied to clipboard!"))
                    .catch(() => fallbackCopy(shareUrlInput));
            } else {
                fallbackCopy(shareUrlInput);
            }
        }

        function fallbackCopy(inputElement) {
            inputElement.select();
            document.execCommand("copy");
            alert("Link copied to clipboard!");
        }
